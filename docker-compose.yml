services:
  app:
    build:
      context: ./django_app
      dockerfile: Dockerfile
    container_name: microlearn
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - ./django_app/.env
    expose:
      - "8000"
    networks:
      - custom-network
    restart: unless-stopped

  microlearn_nginx:
    image: nginx:alpine
    container_name: microlearn_nginx
    depends_on:
      - app
    volumes:
      - static_volume:/staticfiles:ro
      - media_volume:/mediafiles:ro
      - ./django_app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./django_app/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    networks:
      - custom-network
    restart: unless-stopped
    
networks:
  custom-network:
    external: true

volumes:
  static_volume:
  media_volume:
